<!doctype html>
<!-- Lunacy web UI page; build-web.sh copies it over Rune's generated one. -->
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#fafafa">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0a0a">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<title>Lunacy</title>
<style>
:root{--bg:#fafafa;--fg:#0a0a0a;--muted:#737373;--ring-track:rgba(10,10,10,.12);--err-bg:#fff;--err-border:#fecaca;--err-fg:#991b1b;--err-shadow:0 4px 20px rgba(0,0,0,.06)}
@media (prefers-color-scheme:dark){:root{--bg:#0a0a0a;--fg:#fafafa;--muted:#a3a3a3;--ring-track:rgba(250,250,250,.14);--err-bg:#141414;--err-border:#7f1d1d;--err-fg:#fca5a5;--err-shadow:0 8px 28px rgba(0,0,0,.45)}}
html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none;background:var(--bg);color:var(--fg)}
#status{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,sans-serif;transition:opacity 180ms cubic-bezier(.4,0,.2,1),transform 180ms cubic-bezier(.4,0,.2,1)}
#status.is-ready{opacity:0;transform:scale(.985);pointer-events:none}
#status code{font:13px ui-monospace,monospace}
.splash{display:flex;flex-direction:column;align-items:center;gap:14px;animation:splash-in 240ms cubic-bezier(.16,1,.3,1)}
.mark{position:relative;width:44px;height:44px;display:grid;place-items:center}
.ring{position:absolute;inset:0;border-radius:50%;border:2px solid var(--ring-track);border-top-color:var(--fg);animation:spin .9s linear infinite}
.logo{width:26px;height:26px;display:block;color:var(--fg);animation:pulse 1.8s ease-in-out infinite}
.label{font:500 14px/1.4 system-ui,-apple-system,sans-serif;letter-spacing:-.01em;color:var(--muted)}
.error-card{max-width:560px;width:100%;padding:20px 24px;box-sizing:border-box;border-radius:12px;background:var(--err-bg);border:1px solid var(--err-border);color:var(--err-fg);box-shadow:var(--err-shadow);font:15px/1.55 system-ui,-apple-system,sans-serif;user-select:text;word-break:break-word}
@keyframes splash-in{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:scale(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:.55;transform:scale(.94)}50%{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){#status{transition:none}.splash,.ring,.logo{animation:none}}
</style>
<div id="status" role="status" aria-live="polite"><div class="splash"><div class="mark" aria-hidden="true"><span class="ring"></span><svg class="logo" viewBox="0 0 128 128" fill="none"><g fill="currentColor" fill-opacity="0.45"><path d="M98.93 44.21A40.74 32.49 -13 0 1 89.27 78.47L86.89 72.73A37.74 30.09 -13 0 0 98.93 44.21Z"/><path d="M77.89 85.93A40.74 32.49 -13 0 1 25.16 76.2L33.28 73.82A37.74 30.09 -13 0 0 71.43 80.7Z"/><path d="M20.98 66.99A40.74 32.49 -13 0 1 30.44 38.38A37.74 30.09 -13 0 0 26.1 63.39Z"/></g><g fill="currentColor"><path d="M71.71 17.65A57.24 45.89 -13 0 1 105.45 28.28L100.25 30.08A49.99 40.08 -13 0 0 71.71 17.65Z"/><path d="M111.98 34.18A57.24 45.89 -13 0 1 100.48 97.69L93.33 86.18A49.99 40.08 -13 0 0 106.14 37.53Z"/><path d="M93.63 102.04A57.24 45.89 -13 0 1 10.87 81.6L16.62 79.29A49.99 40.08 -13 0 0 84.23 91.95Z"/><path d="M8.99 74.35A57.24 45.89 -13 0 1 15.44 46.05A49.99 40.08 -13 0 0 13.16 71.9Z"/><path fill-rule="evenodd" d="M33.22 17.29C56.29 42.59 70.3 46.01 117.46 27.38C73.58 50.25 70.81 61.34 103.85 108.68C65.96 63.63 52.13 60.37 6 79.95C48.84 56.13 51.44 44.87 33.22 17.29ZM48.3 36.6C58.44 50.55 57.62 54.09 35.78 65.42C58.38 55.07 62.73 56.1 80.79 78.64C63.85 55.57 64.72 52.08 87.06 41.24C63.96 51.1 59.56 50.02 48.3 36.6Z"/></g></svg></div><span class="label">Loading Lunacy…</span></div></div>
<!-- Absolute paths: the daemon also serves this page for deep links like /runs/{id}.
     data-cfasync=false keeps Cloudflare Rocket Loader from rewriting the module. -->
<script type="module" data-cfasync="false">
const status = document.querySelector('#status');
// Sign-in link: /#token=… stores the API token for this site and drops it from the address bar
// (a fragment is never sent to the server), so a phone needs no pasting.
const t = location.hash.match(/^#token=([^&]+)/);
if (t) {
  localStorage.setItem('lunacy.token', decodeURIComponent(t[1]).trim());
  history.replaceState(null, '', location.pathname + location.search);
}
// /runs/{id} → #/runs/{id}, the route the app reads (GitHub check links use either).
const m = location.pathname.match(/^\/runs\/([^/]+)\/?$/);
if (m && !location.hash) history.replaceState(null, '', '/#/runs/' + m[1]);
try {
  if (!navigator.gpu) {
    throw new Error('This page draws with WebGPU, which this browser has not enabled. Use a current Chrome, Edge or Safari; on Firefox and on Linux Chrome it may need enabling (chrome://flags/#enable-unsafe-webgpu).');
  }
  const buildVer = '/*__LUNACY_BUILD__*/';
  const q = /^[0-9a-f]{8,}$/.test(buildVer) ? '?v=' + buildVer : '';
  const { default: init } = await import('/app.js' + q);
  await init({ module_or_path: '/app_bg.wasm' + q });
  if (window.matchMedia?.('(prefers-reduced-motion: reduce)').matches) {
    status.remove();
  } else {
    let done = false;
    const removeStatus = () => {
      if (done) return;
      done = true;
      status.remove();
    };
    status.addEventListener('transitionend', (e) => {
      if (e.target === status) removeStatus();
    });
    status.classList.add('is-ready');
    setTimeout(removeStatus, 220);
  }
} catch (error) {
  const card = document.createElement('div');
  card.className = 'error-card';
  card.textContent = 'Lunacy could not start: ' + (error && error.message || error);
  status.classList.add('is-error');
  status.replaceChildren(card);
  console.error(error);
}
</script>
</html>
