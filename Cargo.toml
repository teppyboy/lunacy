[package]
name = "lunacy"
version = "0.1.0"
edition = "2021"
description = "Small local CI/deploy daemon: poll a git remote, run shell/act steps, report to GitHub and Discord"
license = "MIT"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.23"
directories = "6"
env_logger = "0.11"
fs2 = "0.4"
futures-util = "0.3"
hmac = "0.13"
log = "0.4"
rsa = { version = "0.10", features = ["pkcs1v15"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.11"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time"] }
toml = "1"
toml_edit = "0.25"
ureq = { version = "3", default-features = false, features = ["json", "rustls"] }
clap = { version = "4", features = ["derive"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
tiny_http = "0.12"
tungstenite = "0.30"

[[bin]]
name = "lunacy"
path = "src/bin/lunacy.rs"
