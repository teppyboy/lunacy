<!doctype html>
<!-- lunacy web UI page; build-web.sh copies it over Rune's generated one. -->
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>lunacy</title>
<style>
:root{--bg:#fafafa;--fg:#18181b;--muted:#71717a;--ring-track:rgba(24,24,27,.12);--dot:#18181b;--err-bg:#fff;--err-border:#fecaca;--err-fg:#991b1b;--err-shadow:0 4px 20px rgba(0,0,0,.06)}
@media (prefers-color-scheme:dark){:root{--bg:#09090b;--fg:#fafafa;--muted:#a1a1aa;--ring-track:rgba(250,250,250,.14);--dot:#fafafa;--err-bg:#18181b;--err-border:#7f1d1d;--err-fg:#fca5a5;--err-shadow:0 8px 28px rgba(0,0,0,.45)}}
html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none;background:var(--bg);color:var(--fg)}
#status{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,sans-serif;transition:opacity 180ms cubic-bezier(.4,0,.2,1),transform 180ms cubic-bezier(.4,0,.2,1)}
#status.is-ready{opacity:0;transform:scale(.985);pointer-events:none}
#status code{font:13px ui-monospace,monospace}
.splash{display:flex;flex-direction:column;align-items:center;gap:14px;animation:splash-in 240ms cubic-bezier(.16,1,.3,1)}
.mark{position:relative;width:36px;height:36px;display:grid;place-items:center}
.ring{position:absolute;inset:0;border-radius:50%;border:2px solid var(--ring-track);border-top-color:var(--fg);animation:spin .9s linear infinite}
.dot{width:7px;height:7px;border-radius:50%;background:var(--dot);animation:pulse 1.8s ease-in-out infinite}
.label{font:500 14px/1.4 system-ui,-apple-system,sans-serif;letter-spacing:-.01em;color:var(--muted)}
.error-card{max-width:560px;width:100%;padding:20px 24px;box-sizing:border-box;border-radius:12px;background:var(--err-bg);border:1px solid var(--err-border);color:var(--err-fg);box-shadow:var(--err-shadow);font:15px/1.55 system-ui,-apple-system,sans-serif;user-select:text;word-break:break-word}
@keyframes splash-in{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:scale(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:.35;transform:scale(.85)}50%{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){#status{transition:none}.splash,.ring,.dot{animation:none}}
</style>
<div id="status" role="status" aria-live="polite"><div class="splash"><div class="mark" aria-hidden="true"><span class="ring"></span><span class="dot"></span></div><span class="label">Loading lunacy…</span></div></div>
<!-- Absolute paths: the daemon also serves this page for deep links like /runs/{id}.
     data-cfasync=false keeps Cloudflare Rocket Loader from rewriting the module. -->
<script type="module" data-cfasync="false">
const status = document.querySelector('#status');
// Sign-in link: /#token=… stores the API token for this site and drops it from the address bar
// (a fragment is never sent to the server), so a phone needs no pasting.
const t = location.hash.match(/^#token=([^&]+)/);
if (t) {
  localStorage.setItem('lunacy.token', decodeURIComponent(t[1]).trim());
  history.replaceState(null, '', location.pathname + location.search);
}
// /runs/{id} → #/runs/{id}, the route the app reads (GitHub check links use either).
const m = location.pathname.match(/^\/runs\/([^/]+)\/?$/);
if (m && !location.hash) history.replaceState(null, '', '/#/runs/' + m[1]);
try {
  if (!navigator.gpu) {
    throw new Error('This page draws with WebGPU, which this browser has not enabled. Use a current Chrome, Edge or Safari; on Firefox and on Linux Chrome it may need enabling (chrome://flags/#enable-unsafe-webgpu).');
  }
  const buildVer = '/*__LUNACY_BUILD__*/';
  const q = /^[0-9a-f]{8,}$/.test(buildVer) ? '?v=' + buildVer : '';
  const { default: init } = await import('/app.js' + q);
  await init({ module_or_path: '/app_bg.wasm' + q });
  if (window.matchMedia?.('(prefers-reduced-motion: reduce)').matches) {
    status.remove();
  } else {
    let done = false;
    const removeStatus = () => {
      if (done) return;
      done = true;
      status.remove();
    };
    status.addEventListener('transitionend', (e) => {
      if (e.target === status) removeStatus();
    });
    status.classList.add('is-ready');
    setTimeout(removeStatus, 220);
  }
} catch (error) {
  const card = document.createElement('div');
  card.className = 'error-card';
  card.textContent = 'lunacy could not start: ' + (error && error.message || error);
  status.classList.add('is-error');
  status.replaceChildren(card);
  console.error(error);
}
</script>
</html>
