<!doctype html>
<!-- lunacy web UI page; build-web.sh copies it over Rune's generated one. -->
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>lunacy</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none}
#status{font:16px/1.5 system-ui,sans-serif;padding:24px;max-width:640px}
#status code{font:14px ui-monospace,monospace}
</style>
<div id="status">Loading lunacy…</div>
<!-- Absolute paths: the daemon also serves this page for deep links like /runs/{id}.
     data-cfasync=false keeps Cloudflare Rocket Loader from rewriting the module. -->
<script type="module" data-cfasync="false">
const status = document.querySelector('#status');
// /runs/{id} → #/runs/{id}, the route the app reads (GitHub check links use either).
const m = location.pathname.match(/^\/runs\/([^/]+)\/?$/);
if (m && !location.hash) history.replaceState(null, '', '/#/runs/' + m[1]);
try {
  if (!navigator.gpu) {
    throw new Error('This page draws with WebGPU, which this browser has not enabled. Use a current Chrome, Edge or Safari; on Firefox and on Linux Chrome it may need enabling (chrome://flags/#enable-unsafe-webgpu).');
  }
  const { default: init } = await import('/app.js');
  await init({ module_or_path: '/app_bg.wasm' });
  status.remove();
} catch (error) {
  status.textContent = 'lunacy could not start: ' + (error && error.message || error);
  console.error(error);
}
</script>
</html>
