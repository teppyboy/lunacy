[package]
name = "lunacy-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Rune UI for the Lunacy local CI/deploy daemon"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "lunacy-ui"
path = "src/main.rs"

[dependencies]
lunacy-client.workspace = true
rune = { git = "https://github.com/anomalyco/rune", rev = "267df807ae5a23b7310eca336ca1af85ead32fa5", default-features = true }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "267df807ae5a23b7310eca336ca1af85ead32fa5", default-features = true }
serde.workspace = true
serde_json.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq.workspace = true
tungstenite = { version = "0.30", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
sha2.workspace = true
flate2 = "1"
tar = "0.4"
zip = { version = "9", default-features = false, features = ["deflate"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["CloseEvent", "ErrorEvent", "Event", "Headers", "History", "Location", "MessageEvent", "Request", "RequestInit", "Response", "Storage", "WebSocket", "Window"] }
