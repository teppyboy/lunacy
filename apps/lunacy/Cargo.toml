[package]
name = "lunacy"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Small local CI/deploy daemon: poll a git remote, run shell/act steps, report to GitHub and Discord"

[dependencies]
lunacy-core.workspace = true
anyhow.workspace = true
axum.workspace = true
clap.workspace = true
env_logger.workspace = true
futures-util.workspace = true
hmac.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
tokio.workspace = true
toml.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
lunacy-client.workspace = true
serde_ignored.workspace = true
fs2.workspace = true
tempfile.workspace = true
tiny_http.workspace = true
tungstenite.workspace = true

[[bin]]
name = "lunacy"
path = "src/main.rs"
